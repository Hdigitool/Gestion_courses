<script>

// ===== format.js =====
// =============================================================================
// FORMAT DES DONNÉES (bloc B6 Persistance) — ADR-01, SEC-05, ENF-05
// Le fichier JSON est la seule source de vérité. Ce module crée, valide,
// migre et sérialise l'état. Aucune dépendance à l'affichage.
// =============================================================================
(function (racine) {
  'use strict';

  const NOM_FORMAT = 'gestion-menu';
  const VERSION = 1; // À incrémenter à chaque changement de structure, avec une migration ci-dessous.

  // Sous-catégories « frais » par défaut (ADR-08), modifiables dans l'onglet Catalogue.
  const FRAIS_PAR_DEFAUT = ['Fruits & légumes', 'Frais (crèmerie, fromages)', 'Boulangerie', 'Boucherie'];

  function nouvelEtat() {
    return {
      format: NOM_FORMAT,
      version: VERSION,
      enregistreLe: null,
      parametres: { tolerance: 0 },   // tolérance d'arrondi en % (RM-05), 0 par défaut
      sejours: [],                    // { id, nom, nbJours, moments[{id,nom}], repas[{jour,momentId,recetteId,effectif}], rattachements{ingredientId: code} }
      recettes: [],                   // { id, nom, etiquettes[], materiel[], origineId, lignes[{id,ingredientId,quantite,unite}] }
      ingredients: [],                // { id, nom, dernierProduit }
      equivalences: [],               // { id, ingredientId, qA, uA, qB, uB }  ex. 1 pièce = 150 g
      produits: [],                   // colonnes du catalogue + contenance {q,u}, contenanceValidee, present
      sousCategories: [],             // { nom, frais }
      dernierImport: null             // { date, total, alimentaires }
    };
  }

  // Identifiant court et unique, suffisant pour un usage local.
  let compteur = 0;
  function id(prefixe) {
    compteur += 1;
    return (prefixe || 'x') + '-' + Date.now().toString(36) + '-' + compteur.toString(36);
  }

  // --- Validation ------------------------------------------------------------
  // On vérifie la structure avant de charger quoi que ce soit (SEC-05) :
  // en cas d'échec, rien n'est remplacé et le message dit quoi faire.
  const LISTES = ['sejours', 'recettes', 'ingredients', 'equivalences', 'produits', 'sousCategories'];

  function erreurFormat(nomFichier, detail) {
    return { ok: false, erreur: 'Le fichier' + (nomFichier ? ' « ' + nomFichier + ' »' : '') +
      ' n’a pas été ouvert : ' + detail + ' Vos données actuelles n’ont pas été modifiées. Ouvrez un fichier enregistré par cet outil.' };
  }

  function lire(texte, nomFichier) {
    let obj;
    try { obj = JSON.parse(texte); } catch (e) { return erreurFormat(nomFichier, 'son contenu n’est pas un JSON lisible.'); }
    if (!obj || typeof obj !== 'object' || obj.format !== NOM_FORMAT) return erreurFormat(nomFichier, 'ce n’est pas un fichier de menus de séjour.');
    if (!Number.isInteger(obj.version) || obj.version < 1 || obj.version > VERSION) {
      return erreurFormat(nomFichier, 'son format (version ' + obj.version + ') n’est pas reconnu.');
    }
    obj = migrer(obj);
    for (const cle of LISTES) {
      if (!Array.isArray(obj[cle])) return erreurFormat(nomFichier, 'la liste « ' + cle + ' » est absente ou abîmée.');
    }
    if (!obj.parametres || typeof obj.parametres.tolerance !== 'number') return erreurFormat(nomFichier, 'les paramètres sont absents ou abîmés.');
    for (const s of obj.sejours) {
      if (!s || typeof s.nom !== 'string' || !Number.isInteger(s.nbJours) || !Array.isArray(s.moments) || !Array.isArray(s.repas) || typeof s.rattachements !== 'object') {
        return erreurFormat(nomFichier, 'un séjour est incomplet.');
      }
    }
    for (const r of obj.recettes) {
      if (!r || typeof r.nom !== 'string' || !Array.isArray(r.lignes)) return erreurFormat(nomFichier, 'une recette est incomplète.');
    }
    for (const p of obj.produits) {
      if (!p || typeof p.code !== 'string') return erreurFormat(nomFichier, 'un produit n’a pas de code.');
    }
    return { ok: true, etat: obj };
  }

  // Migrations d'une version du format à la suivante. Chaque étape est testée.
  // Exemple futur : if (obj.version === 1) { ...; obj.version = 2; }
  function migrer(obj) {
    return obj;
  }

  function serialiser(etat) {
    return JSON.stringify(Object.assign({}, etat, { enregistreLe: new Date().toISOString() }), null, 2);
  }

  const deux = (n) => String(n).padStart(2, '0');
  // SEC-03 : un nom daté à chaque enregistrement, pour garder des versions successives.
  function nomFichier(date) {
    const d = date || new Date();
    return 'menus_' + d.getFullYear() + '-' + deux(d.getMonth() + 1) + '-' + deux(d.getDate()) + '_' + deux(d.getHours()) + deux(d.getMinutes()) + '.json';
  }

  const api = { NOM_FORMAT, VERSION, FRAIS_PAR_DEFAUT, nouvelEtat, id, lire, migrer, serialiser, nomFichier };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else racine.GM_format = api;
})(this);


// ===== rules.js =====
// =============================================================================
// RÈGLES ET CALCULS (bloc B5) — fonctions pures, sans lien avec l'affichage.
// RM-01 besoin, RM-03 agrégation, RM-05 arrondi + répartition, RM-06/07 rattachement,
// RM-08 frais, RM-09 conversion, F-10 manques. Testées par tests/rules.test.js.
// =============================================================================
(function (racine) {
  'use strict';

  // --- Unités (liste fixe, ADR-02) ------------------------------------------
  const UNITES = ['g', 'kg', 'ml', 'cl', 'l', 'pièce'];
  const FAMILLES = {
    g: ['masse', 1], kg: ['masse', 1000],
    ml: ['volume', 1], cl: ['volume', 10], l: ['volume', 1000],
    'pièce': ['piece', 1]
  };
  const famille = (u) => (FAMILLES[u] ? FAMILLES[u][0] : null);

  // Évite les faux restes dus aux nombres à virgule (0,1 + 0,2 ≠ 0,3).
  const net = (x) => Math.round(x * 1e9) / 1e9;

  // Conversion générique au sein d'une même famille (g↔kg, ml↔cl↔l).
  function convertirGenerique(q, de, vers) {
    if (!FAMILLES[de] || !FAMILLES[vers] || famille(de) !== famille(vers)) return null;
    return net(q * FAMILLES[de][1] / FAMILLES[vers][1]);
  }

  // RM-09 : d'abord la conversion générique, sinon une équivalence de l'ingrédient
  // (ex. 1 pièce = 150 g), dans un sens ou dans l'autre. null = « sans conversion ».
  function convertir(q, de, vers, equivalences) {
    const g = convertirGenerique(q, de, vers);
    if (g !== null) return g;
    for (const eq of equivalences || []) {
      const sens = [[eq.qA, eq.uA, eq.qB, eq.uB], [eq.qB, eq.uB, eq.qA, eq.uA]];
      for (const [qx, ux, qy, uy] of sens) {
        const dansX = convertirGenerique(q, de, ux);
        if (dansX === null || famille(uy) !== famille(vers)) continue;
        return convertirGenerique(dansX * qy / qx, uy, vers);
      }
    }
    return null;
  }

  // --- Contenance (ADR-04) ----------------------------------------------------
  const normUnite = (u) => {
    u = u.toLowerCase();
    if (u === 'pc' || u === 'pcs' || u === 'pièce' || u === 'pièces' || u === 'piece' || u === 'pieces') return 'pièce';
    return u;
  };

  // Propose une contenance à partir du texte libre de la colonne `Unité`.
  // Exemples : « 500g » → 500 g ; « 10x20cl » → 200 cl ; « caisse 8 kg » → 8 kg ;
  // « 10pc » → 10 pièces ; « pqt de 100 » → 100 pièces. Illisible → null.
  function proposerContenance(texte) {
    const s = String(texte || '').trim().toLowerCase().replace(/±/g, '').replace(/,/g, '.').trim();
    if (!s) return null;
    let m = s.match(/^(\d+)\s*x\s*(\d+(?:\.\d+)?)\s*(kg|g|ml|cl|l)$/);
    if (m) return { q: net(Number(m[1]) * Number(m[2])), u: m[3] };
    m = s.match(/^(\d+)\s*(pc|pcs|pièces?|pieces?)$/);
    if (m) return { q: Number(m[1]), u: 'pièce' };
    m = s.match(/^(?:pqt|paquet|boîte|boite|lot)\s+de\s+(\d+)$/);
    if (m) return { q: Number(m[1]), u: 'pièce' };
    m = s.match(/(?:^|\s)(\d+(?:\.\d+)?)\s*(kg|g|ml|cl|l)$/);
    if (m && Number(m[1]) > 0) return { q: Number(m[1]), u: m[2] };
    return null;
  }

  // Lit une contenance saisie par l'utilisateur : « 500 g », « 1,5 l », « 10 pièces ».
  function lireContenance(texte) {
    const m = String(texte || '').trim().match(/^(\d+(?:[.,]\d+)?)\s*(g|kg|ml|cl|l|L|pièces?|pieces?|pc|pcs)$/i);
    if (!m) return null;
    const q = Number(m[1].replace(',', '.'));
    if (!(q > 0)) return null;
    return { q, u: normUnite(m[2]) };
  }

  // --- RM-01 : besoin d'un ingrédient pour un repas ---------------------------
  const besoinRepas = (quantitePour10, effectif) => net(quantitePour10 * effectif / 10);

  // --- RM-05 : arrondi du total au conditionnement ----------------------------
  // N = Q / C. On garde ⌊N⌋ si le manque qui en résulte reste sous la tolérance
  // (en % du total), sinon ⌈N⌉. Un multiple exact n'est jamais arrondi au-dessus.
  function arrondirTotal(Q, C, tolerancePct) {
    if (!(Q > 0) || !(C > 0)) return 0;
    const N = net(Q / C);
    const bas = Math.floor(N);
    if (N === bas) return bas;
    const manque = (N - bas) * C;
    return manque <= (tolerancePct || 0) / 100 * Q + 1e-12 ? bas : bas + 1;
  }

  // Répartition du total arrondi sur les lignes, au plus fort reste.
  // `besoins` est dans l'ordre chronologique ; à égalité, la ligne la plus tôt l'emporte.
  function repartir(total, besoins) {
    const Q = besoins.reduce((a, b) => a + b, 0);
    if (!(Q > 0)) return besoins.map(() => 0);
    const parts = besoins.map((b) => net(total * b / Q));
    const base = parts.map(Math.floor);
    let reste = total - base.reduce((a, b) => a + b, 0);
    const ordre = parts.map((p, i) => [net(p - base[i]), i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]);
    for (let k = 0; reste > 0 && k < ordre.length; k++, reste--) base[ordre[k][1]] += 1;
    return base;
  }

  // --- Produits ---------------------------------------------------------------
  const estRattachable = (p) => typeof p.code === 'string' && p.code.startsWith('ALM-') && p.actif === 'Oui';

  // RM-08 : « Frais » si la sous-catégorie du produit est marquée frais (ADR-08).
  function aCommander(produit, sousCategories) {
    const sc = (sousCategories || []).find((s) => s.nom === produit.sousCategorie);
    return sc && sc.frais ? 'Frais' : 'Gros achat';
  }

  const totalLigne = (q, prix) => Math.round(q * prix * 100) / 100;

  // Nombre au format belge : virgule décimale. Sans `decimales`, la forme la plus courte.
  function nombreFr(n, decimales) {
    if (n === null || n === undefined || Number.isNaN(n)) return '';
    const t = decimales === undefined ? String(net(n)) : Number(n).toFixed(decimales);
    return t.replace('.', ',');
  }

  // Affichage lisible d'une quantité (panneau du repas, fiche) : 2300 g → 2,3 kg.
  function formatQuantite(q, u) {
    if (u === 'g' && q >= 1000) return nombreFr(net(q / 1000)) + ' kg';
    if (u === 'ml' && q >= 1000) return nombreFr(net(q / 1000)) + ' l';
    if (u === 'pièce') return nombreFr(Math.round(q * 10) / 10) + (q > 1 ? ' pièces' : ' pièce');
    return nombreFr(Math.round(q * 1000) / 1000) + ' ' + u;
  }

  // --- Accès aux données ------------------------------------------------------
  const trouver = (liste, id) => liste.find((x) => x.id === id);
  const produitParCode = (etat, code) => etat.produits.find((p) => p.code === code);
  const equivalencesDe = (etat, ingredientId) => etat.equivalences.filter((e) => e.ingredientId === ingredientId);

  // Statut d'un ingrédient dans un séjour (F-10). Un seul manque par ingrédient, par priorité.
  // 'pret' | 'non-rattache' | 'introuvable' | 'contenance' | 'sans-conversion'
  function statutIngredient(etat, sejour, ingredientId, uniteRecette) {
    const code = sejour.rattachements[ingredientId];
    if (!code) return 'non-rattache';
    const p = produitParCode(etat, code);
    if (!p || p.present === false) return 'introuvable';
    if (!p.contenance || !p.contenanceValidee) return 'contenance';
    if (uniteRecette && convertir(1, uniteRecette, p.contenance.u, equivalencesDe(etat, ingredientId)) === null) return 'sans-conversion';
    return 'pret';
  }

  const LIBELLES_MANQUE = {
    'effectif': 'effectif non renseigné',
    'non-rattache': 'aucun produit rattaché',
    'introuvable': 'produit absent du dernier catalogue',
    'contenance': 'contenance du produit non validée',
    'sans-conversion': 'pas de conversion vers l’unité du produit'
  };

  // F-10 : liste des éléments à compléter pour un repas.
  function manquesRepas(etat, sejour, repas) {
    const recette = trouver(etat.recettes, repas.recetteId);
    if (!recette) return [];
    const manques = [];
    if (repas.effectif === null || repas.effectif === undefined || repas.effectif === '') {
      manques.push({ type: 'effectif', ingredientId: null, nom: 'Effectif', texte: LIBELLES_MANQUE.effectif });
    }
    const vus = new Set();
    for (const l of recette.lignes) {
      if (vus.has(l.ingredientId)) continue;
      vus.add(l.ingredientId);
      const st = statutIngredient(etat, sejour, l.ingredientId, l.unite);
      if (st !== 'pret') {
        const ing = trouver(etat.ingredients, l.ingredientId);
        manques.push({ type: st, ingredientId: l.ingredientId, nom: ing ? ing.nom : '?', texte: LIBELLES_MANQUE[st] });
      }
    }
    return manques;
  }

  // Ingrédients utilisés dans un séjour, avec les repas qui les utilisent.
  function ingredientsDuSejour(etat, sejour) {
    const map = new Map();
    for (const r of sejour.repas) {
      const rec = trouver(etat.recettes, r.recetteId);
      if (!rec) continue;
      for (const l of rec.lignes) {
        if (!map.has(l.ingredientId)) map.set(l.ingredientId, { ingredientId: l.ingredientId, recettes: new Set(), unites: new Set() });
        map.get(l.ingredientId).recettes.add(rec.nom);
        map.get(l.ingredientId).unites.add(l.unite);
      }
    }
    return [...map.values()].map((x) => {
      const ing = trouver(etat.ingredients, x.ingredientId);
      let statut = 'pret';
      for (const u of x.unites) { const s = statutIngredient(etat, sejour, x.ingredientId, u); if (s !== 'pret') { statut = s; break; } }
      return { ingredientId: x.ingredientId, nom: ing ? ing.nom : '?', recettes: [...x.recettes].sort(), statut };
    }).sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
  }

  // --- Calcul de l'export (F-12) ---------------------------------------------
  // Retourne les lignes au format du contrat d'interface et la liste des manques.
  function calculerExport(etat, sejourId) {
    const sejour = trouver(etat.sejours, sejourId);
    const ordreMoment = new Map(sejour.moments.map((m, i) => [m.id, i]));
    const nomMoment = new Map(sejour.moments.map((m) => [m.id, m.nom]));
    const repasTries = sejour.repas.slice().sort((a, b) => a.jour - b.jour || ordreMoment.get(a.momentId) - ordreMoment.get(b.momentId));
    const tolerance = etat.parametres.tolerance || 0;

    const groupes = new Map();   // clé code|jour|moment → ligne normale (unité de contenance)
    const aVerifier = new Map(); // clé code|jour|moment|unité → ligne « À vérifier » (unité de recette)
    const manques = [];

    for (const r of repasTries) {
      const recette = trouver(etat.recettes, r.recetteId);
      if (!recette) continue;
      const ctx = { jour: r.jour, moment: nomMoment.get(r.momentId), ordre: ordreMoment.get(r.momentId), recette: recette.nom };
      for (const m of manquesRepas(etat, sejour, r)) manques.push(Object.assign({}, ctx, m));
      if (r.effectif === null || r.effectif === undefined || r.effectif === '' || r.effectif === 0) continue;

      for (const l of recette.lignes) {
        const code = sejour.rattachements[l.ingredientId];
        const p = code && produitParCode(etat, code);
        if (!p) continue; // non rattaché : pas de code à exporter
        const besoin = besoinRepas(l.quantite, r.effectif);
        const conv = p.contenance && p.contenanceValidee
          ? convertir(besoin, l.unite, p.contenance.u, equivalencesDe(etat, l.ingredientId)) : null;
        if (conv === null) {
          const cle = [code, r.jour, r.momentId, l.unite].join('|');
          const g = aVerifier.get(cle) || { produit: p, ctx, besoin: 0, unite: l.unite };
          g.besoin = net(g.besoin + besoin);
          aVerifier.set(cle, g);
        } else {
          const cle = [code, r.jour, r.momentId].join('|');
          const g = groupes.get(cle) || { produit: p, ctx, besoin: 0 };
          g.besoin = net(g.besoin + conv);
          groupes.set(cle, g);
        }
      }
    }

    // Arrondi sur le total par produit (RM-05), puis répartition par repas.
    const parCode = new Map();
    for (const g of groupes.values()) {
      if (!parCode.has(g.produit.code)) parCode.set(g.produit.code, []);
      parCode.get(g.produit.code).push(g);
    }
    const lignes = [];
    for (const liste of parCode.values()) {
      const p = liste[0].produit;
      const Q = liste.reduce((a, g) => a + g.besoin, 0);
      const T = arrondirTotal(Q, p.contenance.q, tolerance);
      const parts = repartir(T, liste.map((g) => net(g.besoin / p.contenance.q)));
      liste.forEach((g, i) => lignes.push(ligneExport(p, g.ctx, parts[i], aCommander(p, etat.sousCategories), g.besoin)));
    }
    for (const g of aVerifier.values()) {
      lignes.push(ligneExport(g.produit, g.ctx, g.besoin, 'À vérifier', g.besoin, g.unite));
    }
    lignes.sort((a, b) => a.jour - b.jour || a.ordre - b.ordre ||
      a.magasin.localeCompare(b.magasin, 'fr') || a.article.localeCompare(b.article, 'fr'));

    const produitsDistincts = new Set(lignes.map((l) => l.code));
    const magasins = new Set(lignes.map((l) => l.magasin).filter(Boolean));
    return { lignes, manques, resume: { lignes: lignes.length, produits: produitsDistincts.size, magasins: magasins.size } };
  }

  function ligneExport(p, ctx, quantite, aCmd, besoinExact, uniteRecette) {
    const verif = aCmd === 'À vérifier';
    return {
      code: p.code, article: p.nom, marque: p.marque || '', magasin: p.magasin || '',
      quantite, unite: p.unite || '', prix: p.prix,
      totalLigne: verif ? null : totalLigne(quantite, p.prix || 0),
      destination: ctx.moment, activite: 'J' + ctx.jour, aCommander: aCmd, fiche: p.fiche || '',
      jour: ctx.jour, ordre: ctx.ordre, besoinExact, uniteRecette: uniteRecette || null
    };
  }

  const api = {
    UNITES, famille, convertirGenerique, convertir, proposerContenance, lireContenance,
    besoinRepas, arrondirTotal, repartir, estRattachable, aCommander, totalLigne, nombreFr, formatQuantite,
    statutIngredient, manquesRepas, ingredientsDuSejour, calculerExport, LIBELLES_MANQUE
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else racine.GM_rules = api;
})(this);

// =============================================================================
// CSV : import du catalogue et export de la liste de courses (contrat d'interface)
// SEC-06 contrôle de l'import, SEC-07 neutralisation des formules.
// =============================================================================
(function (racine) {
  'use strict';
  const R = (typeof module !== 'undefined' && module.exports) ? require('./rules.js') : racine.GM_rules;
  const F = (typeof module !== 'undefined' && module.exports) ? require('./format.js') : racine.GM_format;

  const COLONNES_CATALOGUE = ['Code', 'Nom', 'Marque', 'Sous-catégorie', 'Unité', 'Prix unitaire (EUR)', 'Magasin', 'Fiche produit', 'Statut', 'Actif'];
  const COLONNES_EXPORT = ['Code', 'Article', 'Marque', 'Magasin', 'Quantité', 'Unité', 'Prix unitaire (EUR)', 'Total ligne (EUR)', 'Destination', 'Activité', 'À commander', 'Fiche produit'];
  const TAILLE_MAX = 5 * 1024 * 1024; // un catalogue de 400 produits pèse ~50 Ko

  // Lecteur CSV : séparateur `;`, guillemets doublés, retours à la ligne dans un champ,
  // BOM UTF-8 ignoré, lignes vides ignorées.
  function parser(texte) {
    const s = String(texte).replace(/^﻿/, '');
    const lignes = [];
    let champ = '', ligne = [], guillemets = false;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (guillemets) {
        if (c === '"' && s[i + 1] === '"') { champ += '"'; i++; }
        else if (c === '"') guillemets = false;
        else champ += c;
      } else if (c === '"' && champ === '') guillemets = true; // un guillemet n'ouvre un champ cité qu'en début de champ
      else if (c === ';') { ligne.push(champ); champ = ''; }
      else if (c === '\r' || c === '\n') {
        if (c === '\r' && s[i + 1] === '\n') i++;
        ligne.push(champ); champ = '';
        if (ligne.some((x) => x !== '')) lignes.push(ligne);
        ligne = [];
      } else champ += c;
    }
    ligne.push(champ);
    if (ligne.some((x) => x !== '')) lignes.push(ligne);
    return lignes;
  }

  const nombre = (t) => { const n = Number(String(t || '').trim().replace(',', '.')); return Number.isFinite(n) ? n : 0; };

  // SEC-06 : colonnes attendues par leur nom, codes uniques ; sinon refus complet.
  function lireCatalogue(texte) {
    if (String(texte).length > TAILLE_MAX) return { ok: false, erreur: 'Import refusé : le fichier dépasse 5 Mo. Vérifiez qu’il s’agit bien du catalogue de l’outil de courses.' };
    const lignes = parser(texte);
    if (!lignes.length) return { ok: false, erreur: 'Import refusé : le fichier est vide.' };
    const entete = lignes[0].map((x) => x.trim());
    const index = {};
    for (const col of COLONNES_CATALOGUE) {
      const i = entete.indexOf(col);
      if (i < 0) return { ok: false, erreur: 'Import refusé : la colonne « ' + col + ' » est absente. Exportez de nouveau le catalogue depuis l’outil de courses, sans modifier les en-têtes.' };
      index[col] = i;
    }
    const supplementaires = entete.filter((c) => c && !COLONNES_CATALOGUE.includes(c));
    const vus = new Set();
    const produits = [];
    for (let n = 1; n < lignes.length; n++) {
      const l = lignes[n];
      const v = (col) => (l[index[col]] || '').trim();
      const code = v('Code');
      if (!code) continue;
      if (vus.has(code)) return { ok: false, erreur: 'Import refusé : le code ' + code + ' apparaît deux fois. Corrigez le fichier dans l’outil de courses.' };
      vus.add(code);
      produits.push({
        code, nom: v('Nom'), marque: v('Marque'), sousCategorie: v('Sous-catégorie'), unite: v('Unité'),
        prix: nombre(v('Prix unitaire (EUR)')), magasin: v('Magasin'), fiche: v('Fiche produit'),
        statut: v('Statut'), actif: v('Actif')
      });
    }
    return { ok: true, produits, supplementaires };
  }

  const CHAMPS_COMPARES = ['nom', 'marque', 'sousCategorie', 'unite', 'prix', 'magasin', 'fiche', 'statut', 'actif'];

  // Aperçu avant import (US-01) : rien n'est modifié ici.
  function comparerCatalogue(actuels, importes) {
    const avant = new Map(actuels.map((p) => [p.code, p]));
    const apres = new Set(importes.map((p) => p.code));
    const ajoutes = [], modifies = [], uniteChangee = [];
    for (const p of importes) {
      const a = avant.get(p.code);
      if (!a) { ajoutes.push(p); continue; }
      if (CHAMPS_COMPARES.some((c) => a[c] !== p[c]) || a.present === false) modifies.push(p);
      if (a.unite !== p.unite) uniteChangee.push(p);
    }
    const absents = actuels.filter((p) => !apres.has(p.code) && p.present !== false);
    return { ajoutes, modifies, uniteChangee, absents, total: importes.length, alimentaires: importes.filter(R.estRattachable).length };
  }

  // Applique un import confirmé. Une contenance validée est conservée, sauf si
  // l'unité du produit a changé (validation retirée, nouvelle proposition).
  // Un produit absent n'est jamais supprimé : il est marqué et signalé.
  function appliquerCatalogue(etat, importes, date) {
    const avant = new Map(etat.produits.map((p) => [p.code, p]));
    const codes = new Set(importes.map((p) => p.code));
    const produits = importes.map((p) => {
      const a = avant.get(p.code);
      const garde = a && a.unite === p.unite && a.contenance;
      return Object.assign({}, p, {
        contenance: garde ? a.contenance : R.proposerContenance(p.unite),
        contenanceValidee: garde ? !!a.contenanceValidee : false,
        present: true
      });
    });
    for (const a of etat.produits) if (!codes.has(a.code)) produits.push(Object.assign({}, a, { present: false }));
    const sousCategories = etat.sousCategories.slice();
    for (const p of importes) {
      if (p.sousCategorie && !sousCategories.some((s) => s.nom === p.sousCategorie)) {
        sousCategories.push({ nom: p.sousCategorie, frais: F.FRAIS_PAR_DEFAUT.includes(p.sousCategorie) });
      }
    }
    sousCategories.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    return Object.assign({}, etat, {
      produits, sousCategories,
      dernierImport: { date: (date || new Date()).toISOString(), total: importes.length, alimentaires: importes.filter(R.estRattachable).length }
    });
  }

  // SEC-07 : un texte commençant par =, +, @ ou une tabulation serait exécuté
  // comme formule par un tableur ; on le préfixe d'une apostrophe.
  const neutraliser = (v) => (/^[=+@\t]/.test(String(v)) ? '\'' + v : String(v));

  function champCSV(v) {
    const s = neutraliser(v === null || v === undefined ? '' : v);
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  // Export au format exact de l'outil de courses : UTF-8 sans BOM, `;`, CRLF.
  function exporterCSV(lignes) {
    const rows = [COLONNES_EXPORT];
    for (const l of lignes) {
      rows.push([
        l.code, l.article, l.marque, l.magasin, R.nombreFr(l.quantite), l.unite,
        R.nombreFr(l.prix), l.totalLigne === null ? '' : R.nombreFr(l.totalLigne, 2),
        l.destination, l.activite, l.aCommander, l.fiche
      ]);
    }
    return rows.map((r) => r.map(champCSV).join(';')).join('\r\n') + '\r\n';
  }

  const api = { COLONNES_CATALOGUE, COLONNES_EXPORT, parser, lireCatalogue, comparerCatalogue, appliquerCatalogue, neutraliser, exporterCSV };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else racine.GM_csv = api;
})(this);

  let minuteurToast = null;
  function annoncer(texte) {
    const zone = document.getElementById('statut');
    zone.replaceChildren(h('div', { class: 'toast' }, '✓ ' + texte));
    clearTimeout(minuteurToast);
    minuteurToast = setTimeout(() => zone.replaceChildren(), 5000);
  }

  // ---------------------------------------------------------------------------
  // Fichiers : ouvrir, enregistrer (SEC-01, SEC-03, SEC-05), télécharger
  // ---------------------------------------------------------------------------
  function telecharger(nom, texte, type) {
    const url = URL.createObjectURL(new Blob([texte], { type }));
    const a = h('a', { href: url, download: nom, style: 'display:none' });
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
  }

  function choisirFichier(accept, surFichier) {
    const input = h('input', { type: 'file', accept, style: 'display:none' });
    input.addEventListener('change', () => { const f = input.files[0]; input.remove(); if (f) surFichier(f); });
    document.body.append(input); input.click();
  }

  function demanderOuverture() {
    if (app.etat && app.ui.dirty) {
      ouvrirDialog({ type: 'confirmer', titre: 'Ouvrir un autre fichier ?',
        texte: 'Les modifications non enregistrées seront perdues. Enregistrez d’abord si vous voulez les garder.',
        bouton: 'Ouvrir quand même', danger: true, action: () => choisirFichier('.json,application/json', chargerFichier) });
      return;
    }
    choisirFichier('.json,application/json', chargerFichier);
  }

  async function chargerFichier(fichier) {
    const texte = await fichier.text();
    const r = F.lire(texte, fichier.name);
    if (!r.ok) {
      if (app.etat) app.ui.alerte = r.erreur; else app.ui.erreurDemarrage = r.erreur;
      render(); return;
    }
    demarrerAvec(r.etat, fichier.name, false);
    effacerSecours();
    annoncer('Fichier ouvert : ' + fichier.name);
  }

  function demarrerAvec(etat, nomFichier, modifie) {
    const garde = app.ui.secoursIgnore;
    app.etat = etat;
    app.ui = nouvelleUI();
    app.ui.secoursIgnore = garde;
    app.ui.fichier = nomFichier;
    app.ui.dirty = modifie;
    const s = etat.sejours[0];
    if (s) { app.ui.sejourId = s.id; if (s.moments[0]) { app.ui.sel = [[1, s.moments[0].id]]; app.ui.actif = [1, s.moments[0].id]; } }
    render();
  }

  async function enregistrer() {
    if (!app.etat) return;
    const nom = F.nomFichier(new Date());
    const texte = F.serialiser(app.etat);
    if (window.showSaveFilePicker) {
      try {
        const poignee = await window.showSaveFilePicker({ suggestedName: nom, types: [{ description: 'Fichier de menus', accept: { 'application/json': ['.json'] } }] });
        const w = await poignee.createWritable();
        await w.write(texte); await w.close();
        enregistre(poignee.name || nom);
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        app.ui.alerte = '✕ L’enregistrement a échoué (' + (e && e.message ? e.message : 'erreur inconnue') + '). Vos modifications sont toujours là : réessayez.';
        render();
      }
    } else {
      telecharger(nom, texte, 'application/json');
      enregistre(nom);
    }
  }
  function enregistre(nom) {
    app.ui.fichier = nom; app.ui.dirty = false; app.ui.enregistreA = new Date();
    effacerSecours();
    annoncer('Enregistré : ' + nom);
    render();
  }

  // ---------------------------------------------------------------------------
  // Fenêtres (un seul modèle) : focus piégé, Échap ferme, retour du focus
  // ---------------------------------------------------------------------------
  function ouvrirDialog(d) {
    d.retour = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
    app.ui.dialog = d;
    app.ui.focusApres = 'dlg-defaut';
    render();
  }
  function fermerDialog() {
    const d = app.ui.dialog;
    app.ui.dialog = null;
    if (d && d.retour) app.ui.focusApres = d.retour;
    render();
  }

  // ---------------------------------------------------------------------------
  // Rendu
  // ---------------------------------------------------------------------------
  function render() {
    const actif = document.activeElement;
    const k = actif && actif.dataset ? actif.dataset.k : null;
    const selection = actif && 'selectionStart' in actif ? [actif.selectionStart, actif.selectionEnd] : null;
    document.getElementById('app').replaceChildren(app.etat ? vueApp() : vueDemarrage());
    const cible = app.ui.focusApres || k;
    app.ui.focusApres = null;
    if (cible) {
      const el = document.querySelector('[data-k="' + cible.replace(/"/g, '') + '"]');
      if (el) {
        el.focus({ preventScroll: cible === k });
        if (cible === k && selection && 'setSelectionRange' in el) { try { el.setSelectionRange(selection[0], selection[1]); } catch (e) { /* type sans sélection */ } }
      }
    }
  }

  // ----- Démarrage (F-13, US-08) ---------------------------------------------
  function vueDemarrage() {
    const secours = app.ui.secoursIgnore ? null : lireSecours();
    return h('div', null,
      h('header', { class: 'barre' }, h('div', { class: 'titre' }, 'Menus de séjour'), h('div', { class: 'fichier' }, 'Aucun fichier ouvert')),
      h('main', { class: 'demarrage' },
        h('div', { class: 'gauche' },
          h('h1', null, 'Ouvrez votre fichier de menus pour continuer'),
          h('p', { class: 'muted', style: 'font-size:17px;margin:0' }, 'Vos recettes, séjours et rattachements sont dans un fichier .json sur votre ordinateur. L’outil ne garde rien en ligne.'),
          h('div', { class: 'ligne' },
            h('button', { class: 'btn-primaire', k: 'ouvrir', style: 'min-height:48px', onClick: demanderOuverture }, 'Ouvrir un fichier'),
            h('button', { k: 'nouveau', style: 'min-height:48px', onClick: () => demarrerAvec(F.nouvelEtat(), null, false) }, 'Nouveau fichier')),
          app.ui.erreurDemarrage ? h('div', { class: 'message m-erreur', role: 'alert' }, '✕ ' + app.ui.erreurDemarrage) : null),
        secours ? h('section', { class: 'carte reprise pile', 'aria-labelledby': 'reprise-t' },
          h('h2', { id: 'reprise-t' }, '△ Travail non enregistré retrouvé'),
          h('p', { style: 'margin:0' }, 'Une copie de secours du ', h('strong', null, dateLongue(secours.date)), ' existe dans ce navigateur. Elle contient des modifications faites après le dernier enregistrement' + (secours.fichier ? ' de ' + secours.fichier : '') + '.'),
          h('div', { class: 'muted petit' }, secours.etat.sejours.length + ' séjour(s) · ' + secours.etat.recettes.length + ' recette(s) · ' + secours.etat.produits.length + ' produit(s)'),
          h('div', { class: 'ligne' },
            h('button', { class: 'btn-primaire', k: 'reprendre', onClick: () => { demarrerAvec(secours.etat, secours.fichier, true); annoncer('Copie de secours reprise. Pensez à enregistrer.'); } }, 'Reprendre la copie'),
            h('button', { k: 'ignorer', onClick: () => { app.ui.secoursIgnore = true; render(); demanderOuverture(); } }, 'Ignorer et ouvrir un fichier')),
          h('div', { class: 'muted petit' }, 'Après reprise, pensez à enregistrer : la copie de secours peut être effacée par le navigateur.')) : null));
  }

  // ----- Application ------------------------------------------------------------
  const ONGLETS = [['menu', 'Menu'], ['ingredients', 'Ingrédients du séjour'], ['recettes', 'Recettes'], ['catalogue', 'Catalogue'], ['referentiels', 'Référentiels']];

  function manquesSejour(s) {
    let total = 0, repas = 0;
    if (!s) return { total, repas };
    for (const r of s.repas) { const n = R.manquesRepas(app.etat, s, r).length; if (n) { total += n; repas += 1; } }
    return { total, repas };
  }

  function vueApp() {
    const s = sejour();
    const aFaireIng = s ? R.ingredientsDuSejour(app.etat, s).filter((i) => i.statut !== 'pret').length : 0;
    const etatFichier = app.ui.dirty
      ? h('span', { class: 'etat etat-modifie' }, '● Non enregistré')
      : (app.ui.enregistreA ? h('span', { class: 'etat etat-ok' }, '✓ Enregistré à ' + heure(app.ui.enregistreA)) : (app.ui.fichier ? h('span', { class: 'etat etat-ok' }, '✓ Ouvert') : null));
    const contenu = { menu: vueMenu, ingredients: vueIngredients, recettes: vueRecettes, catalogue: vueCatalogue, referentiels: vueReferentiels }[app.ui.onglet]();
    return h('div', null,
      h('header', { class: 'barre' },
        h('div', { class: 'titre' }, 'Menus de séjour'),
        h('div', { class: 'fichier' }, app.ui.fichier || 'Nouveau fichier'),
        etatFichier,
        h('div', { class: 'espace' }),
        h('button', { k: 'b-ouvrir', onClick: demanderOuverture }, 'Ouvrir'),
        h('button', { k: 'b-enregistrer', title: 'Ctrl+S', onClick: enregistrer }, 'Enregistrer'),
        h('button', { k: 'b-exporter', class: 'btn-primaire', disabled: !s, onClick: () => ouvrirDialog({ type: 'export' }) }, 'Exporter la liste de courses')),
      h('nav', { class: 'onglets', role: 'tablist', 'aria-label': 'Sections' },
        ONGLETS.map(([id, nom]) => h('button', { role: 'tab', k: 'onglet-' + id, 'aria-selected': String(app.ui.onglet === id),
          onClick: () => { app.ui.onglet = id; app.ui.alerte = ''; render(); } },
        nom, id === 'ingredients' && aFaireIng ? h('span', { class: 'pastille p-alerte' }, '△ ' + aFaireIng) : null))),
      app.ui.alerte ? h('div', { class: 'message m-erreur', role: 'alert', style: 'margin:12px 24px 0' }, app.ui.alerte, ' ',
        h('button', { class: 'btn-petit', onClick: () => { app.ui.alerte = ''; render(); } }, 'Fermer')) : null,
      h('main', null, contenu),
      vueDialog());
  }

  // ----- Menu du séjour (F-07, F-08, F-10, US-04, US-06) ----------------------
  function vueMenu() {
    const e = app.etat, s = sejour();
    if (!s) {
      return h('div', { class: 'page' }, h('div', { class: 'carte pile', style: 'max-width:560px' },
        h('h1', null, 'Aucun séjour'),
        h('p', { style: 'margin:0' }, 'Aucun séjour dans ce fichier. Créez-en un pour composer le menu.'),
        h('div', null, h('button', { class: 'btn-primaire', k: 'creer-sejour', onClick: () => ouvrirDialog({ type: 'sejour' }) }, 'Créer un séjour'))));
    }
    const q = norm(app.ui.biblioQ);
    const recettes = e.recettes.filter((r) => !q || norm(r.nom).includes(q) ||
      r.lignes.some((l) => { const i = ingredient(l.ingredientId); return i && norm(i.nom).includes(q); }))
      .sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
    const single = app.ui.sel.length <= 1;
    const [sj, sm] = app.ui.sel[0] || [];
    const m = manquesSejour(s);
    const derniere = app.ui.annulations.filter((a) => a.sejourId === s.id).slice(-1)[0];

    const gauche = h('aside', { class: 'col-g', 'aria-label': 'Bibliothèque de recettes' },
      h('h2', null, 'Recettes'),
      h('label', { class: 'champ' }, h('span', { class: 'muted', style: 'font-weight:400' }, 'Rechercher'),
        h('input', { k: 'biblio-q', value: app.ui.biblioQ, placeholder: 'Nom ou ingrédient', onInput: (ev) => { app.ui.biblioQ = ev.target.value; render(); } })),
      h('div', { class: 'muted petit' }, app.ui.sel.length === 0 ? 'Sélectionnez une case dans la grille.'
        : single ? 'Clic : place la recette en J' + sj + ' ' + nomMoment(s, sm) + ', puis passe au jour suivant.'
          : 'Clic : place la recette dans les ' + app.ui.sel.length + ' cases sélectionnées.'),
      e.recettes.length === 0 ? h('div', { class: 'pile' }, h('p', { style: 'margin:0' }, 'Aucune recette. Créez votre première recette pour 10 personnes.'),
        h('div', null, h('button', { onClick: () => { app.ui.onglet = 'recettes'; render(); } }, 'Nouvelle recette'))) : null,
      e.recettes.length && !recettes.length ? h('div', { class: 'muted' }, 'Aucune recette ne correspond à « ' + app.ui.biblioQ + ' ».') : null,
      recettes.map((r) => h('button', { class: 'biblio-item', k: 'biblio-' + r.id, disabled: app.ui.sel.length === 0, onClick: () => placer(r) },
        h('span', null, r.nom), h('span', { class: 'muted petit' }, r.lignes.length + ' ingr.'))));

    const cols = s.moments.length;
    const grille = h('div', { class: 'grille', role: 'grid', 'aria-label': 'Menu du séjour ' + s.nom + ', jours en lignes, moments en colonnes',
      style: 'grid-template-columns: 64px repeat(' + cols + ', minmax(0, 1fr))' },
    h('div', { role: 'row', style: 'display:contents' }, h('div', { role: 'columnheader' }, h('span', { class: 'sr' }, 'Jour')),
      s.moments.map((mo) => h('div', { role: 'columnheader', class: 'entete-moment' }, mo.nom))),
    Array.from({ length: s.nbJours }, (_, i) => i + 1).map((j) => h('div', { role: 'row', style: 'display:contents' },
      h('div', { role: 'rowheader', class: 'entete-jour' }, 'J' + j),
      s.moments.map((mo) => caseMenu(s, j, mo)))));

    const centre = h('section', { class: 'col-c', 'aria-label': 'Grille du menu' },
      h('div', { class: 'ligne' },
        h('h1', null, s.nom),
        e.sejours.length > 1 ? h('label', null, h('span', { class: 'sr' }, 'Séjour'),
          h('select', { k: 'choix-sejour', onChange: (ev) => { app.ui.sejourId = ev.target.value; app.ui.sel = []; app.ui.actif = null; render(); } },
            e.sejours.map((x) => h('option', { value: x.id, selected: x.id === s.id }, x.nom)))) : null,
        h('span', { class: 'muted' }, s.nbJours + ' jours, ' + s.moments.length + ' moments'),
        m.total ? h('span', { class: 'pastille p-alerte' }, '△ ' + m.total + ' à compléter dans ' + m.repas + ' repas')
          : (s.repas.length ? h('span', { class: 'pastille p-ok' }, '✓ Menu complet, prêt à exporter') : null),
        h('div', { class: 'espace' }),
        h('button', { class: 'btn-petit', k: 'annuler', disabled: !derniere, title: 'Ctrl+Z', onClick: annuler }, '↶ Annuler' + (derniere ? ' (' + derniere.libelle + ')' : '')),
        h('button', { class: 'btn-petit', k: 'modifier-sejour', onClick: () => ouvrirDialog({ type: 'sejour', sejourId: s.id }) }, 'Modifier le séjour'),
        h('button', { class: 'btn-petit', k: 'nouveau-sejour', onClick: () => ouvrirDialog({ type: 'sejour' }) }, 'Nouveau séjour')),
      grille,
      h('div', { class: 'muted petit' }, 'Flèches : changer de case. Entrée : chercher une recette. Maj + clic ou Maj + flèches : sélectionner plusieurs cases. Suppr : vider. Ctrl+Z : annuler dans la grille.'));

    return h('div', { class: 'trois' }, gauche, centre, h('aside', { class: 'col-d', 'aria-label': 'Repas sélectionné' }, panneauRepas(s)));
  }

  function caseMenu(s, j, mo) {
    const r = repasDe(s, j, mo.id);
    const rec = r && recette(r.recetteId);
    const manques = rec ? R.manquesRepas(app.etat, s, r) : [];
    const sel = estSel(j, mo.id);
    const actif = app.ui.actif && app.ui.actif[0] === j && app.ui.actif[1] === mo.id;
    const eff = rec ? (r.effectif === null || r.effectif === undefined ? 'Effectif ?' : r.effectif + ' pers.') : '';
    return h('button', {
      role: 'gridcell', class: 'case' + (rec ? '' : ' vide'), k: 'case-' + j + '-' + mo.id,
      tabindex: actif || (!app.ui.actif && j === 1 && mo.id === s.moments[0].id) ? '0' : '-1',
      'aria-selected': String(sel),
      'aria-label': 'J' + j + ' ' + mo.nom + ', ' + (rec ? rec.nom + ', ' + eff : 'vide') + (manques.length ? ', ' + manques.length + ' élément(s) à compléter' : ''),
      onClick: (ev) => choisirCase(j, mo.id, ev.shiftKey),
      onKeydown: (ev) => toucheCase(ev, s, j, mo.id)
    },
    h('span', { class: 'nom-recette' }, rec ? rec.nom : '+ Placer une recette'),
    h('span', { class: 'bas' }, h('span', { class: 'effectif' }, eff),
      manques.length ? h('span', { class: 'pastille p-alerte', 'aria-hidden': 'true' }, '△ ' + manques.length) : null));
  }

  function choisirCase(j, m, ajout) {
    if (ajout) {
      app.ui.sel = estSel(j, m) ? app.ui.sel.filter(([a, b]) => !(a === j && b === m)) : app.ui.sel.concat([[j, m]]);
      if (!app.ui.sel.length) app.ui.sel = [[j, m]];
    } else app.ui.sel = [[j, m]];
    app.ui.actif = [j, m];
    const r = repasDe(sejour(), j, m);
    app.ui.effBrouillon = r && r.effectif !== null && r.effectif !== undefined ? String(r.effectif) : '';
    app.ui.effErreur = false;
    app.ui.focusApres = 'case-' + j + '-' + m;
    render();
  }

  function toucheCase(ev, s, j, m) {
    const idx = s.moments.findIndex((x) => x.id === m);
    let nj = j, ni = idx;
    if (ev.key === 'ArrowDown') nj = Math.min(s.nbJours, j + 1);
    else if (ev.key === 'ArrowUp') nj = Math.max(1, j - 1);
    else if (ev.key === 'ArrowRight') ni = Math.min(s.moments.length - 1, idx + 1);
    else if (ev.key === 'ArrowLeft') ni = Math.max(0, idx - 1);
    else if (ev.key === 'Enter') { ev.preventDefault(); const q = document.querySelector('[data-k="biblio-q"]'); if (q) q.focus(); return; }
    else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); viderSelection(); return; }
    else return;
    ev.preventDefault();
    choisirCase(nj, s.moments[ni].id, ev.shiftKey);
  }

  function placer(rec) {
    const s = sejour();
    const cibles = app.ui.sel.slice();
    if (!cibles.length) return;
    const remplaces = [];
    modifierGrille('placer « ' + rec.nom + ' »', () => {
      for (const [j, m] of cibles) {
        const r = repasDe(s, j, m);
        if (r) { if (r.recetteId !== rec.id) { const ancien = recette(r.recetteId); if (ancien) remplaces.push(ancien.nom); } r.recetteId = rec.id; }
        else s.repas.push({ jour: j, momentId: m, recetteId: rec.id, effectif: null });
      }
      // Placement en chaîne : une seule case → on passe au jour suivant, même moment.
      if (cibles.length === 1 && cibles[0][0] < s.nbJours) {
        const [j, m] = cibles[0];
        app.ui.sel = [[j + 1, m]]; app.ui.actif = [j + 1, m];
        const suiv = repasDe(s, j + 1, m);
        app.ui.effBrouillon = suiv && suiv.effectif !== null ? String(suiv.effectif) : '';
      }
    });
    if (remplaces.length) annoncer('Remplacé : ' + remplaces.join(', ') + ' → ' + rec.nom + ' (Ctrl+Z pour annuler)');
  }

  function viderSelection() {
    const s = sejour();
    const cibles = app.ui.sel.filter(([j, m]) => repasDe(s, j, m));
    if (!cibles.length) return;
    modifierGrille(cibles.length === 1 ? 'vider J' + cibles[0][0] + ' ' + nomMoment(s, cibles[0][1]) : 'vider ' + cibles.length + ' cases', () => {
      s.repas = s.repas.filter((r) => !cibles.some(([j, m]) => r.jour === j && r.momentId === m));
    });
  }

  function appliquerEffectif() {
    const t = app.ui.effBrouillon.trim();
    if (!/^\d+$/.test(t)) { app.ui.effErreur = true; render(); return; }
    const s = sejour(), n = Number(t);
    const cibles = app.ui.sel.filter(([j, m]) => repasDe(s, j, m));
    if (!cibles.length) return;
    app.ui.effErreur = false;
    modifierGrille('effectif ' + n, () => { for (const [j, m] of cibles) repasDe(s, j, m).effectif = n; });
  }

  function champEffectif(libelle) {
    return h('div', { class: 'pile' },
      h('div', { class: 'ligne', style: 'align-items:flex-end' },
        h('label', { class: 'champ' }, libelle,
          h('input', { k: 'eff', inputmode: 'numeric', style: 'width:100px', class: app.ui.effErreur ? 'invalide' : null,
            'aria-invalid': app.ui.effErreur ? 'true' : null, 'aria-describedby': 'eff-aide', value: app.ui.effBrouillon,
            onInput: (ev) => { app.ui.effBrouillon = ev.target.value; app.ui.effErreur = false; },
            onKeydown: (ev) => { if (ev.key === 'Enter') { ev.preventDefault(); appliquerEffectif(); } } })),
        h('button', { class: app.ui.sel.length > 1 ? 'btn-primaire' : 'btn-contour', k: 'eff-appliquer', onClick: appliquerEffectif },
          app.ui.sel.length > 1 ? 'Appliquer l’effectif' : 'Appliquer')),
      h('div', { id: 'eff-aide', class: app.ui.effErreur ? 'erreur-champ' : 'muted petit' },
        app.ui.effErreur ? '✕ Saisissez un nombre entier, par exemple 42.' : 'Nombre de personnes à nourrir pour ce repas.'));
  }

  function panneauRepas(s) {
    if (!app.ui.sel.length) return h('p', { class: 'muted' }, 'Sélectionnez une case de la grille.');
    if (app.ui.sel.length > 1) {
      return h('div', { class: 'pile' },
        h('h2', null, app.ui.sel.length + ' cases sélectionnées'),
        champEffectif('Effectif à appliquer'),
        h('div', { class: 'muted petit' }, 'Clic sur une recette à gauche : la place dans toutes les cases sélectionnées.'),
        h('div', null, h('button', { class: 'btn-petit', onClick: viderSelection }, 'Vider les cases')));
    }
    const [j, m] = app.ui.sel[0];
    const r = repasDe(s, j, m);
    const rec = r && recette(r.recetteId);
    const titre = h('div', { class: 'muted' }, 'J' + j + ' · ' + nomMoment(s, m));
    if (!rec) return h('div', { class: 'pile' }, titre, h('h2', { style: 'font-size:26px' }, 'Case vide'),
      h('p', { class: 'muted', style: 'margin:0' }, 'Case vide. Cliquez sur une recette à gauche pour la placer ici.'));
    const manques = R.manquesRepas(app.etat, s, r);
    const eff = r.effectif;
    return h('div', { class: 'pile', style: 'gap:14px' },
      titre, h('h2', { style: 'font-size:26px;font-weight:700' }, rec.nom),
      champEffectif('Effectif'),
      manques.length ? h('section', { class: 'message m-alerte pile', 'aria-label': 'Éléments à compléter' },
        h('h3', { style: 'font-size:19px;color:var(--warning-text)' }, '△ ' + manques.length + ' à compléter'),

              h('td', { style: 'text-align:right' }, h('button', { class: code ? 'btn-contour btn-petit' : 'btn-primaire btn-petit', k: 'ing-' + i.ingredientId,
                onClick: () => { app.ui.ingCur = i.ingredientId; app.ui.prodQ = premierMot(i.nom); app.ui.focusApres = 'prod-q'; render(); } }, code ? 'Changer' : 'Rattacher')));

  }

  function panneauRattachement(s) {

    if (!ing) return h('p', { class: 'muted' }, 'Choisissez un ingrédient dans la liste pour le rattacher à un produit.');

    const choisir = (p) => modifier(() => { s.rattachements[ing.id] = p.code; ing.dernierProduit = p.code; app.ui.focusApres = 'ing-' + ing.id; annoncerApres('Rattaché : ' + ing.nom + ' → ' + p.nom); });

          h('span', { style: 'font-weight:600' }, p.nom),
